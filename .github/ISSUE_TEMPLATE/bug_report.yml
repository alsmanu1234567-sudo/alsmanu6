name: 🐛 بلاغ مشكلة
description: وصف مشكلة يمكن تكرارها
body:
  - type: markdown
    attributes:
      value: "لا تضع أي توكن أو جلسة واتساب أو بيانات شخصية في البلاغ."
  - type: textarea
    id: problem
    attributes:
      label: ما المشكلة؟
      description: اشرح المشكلة والنتيجة المتوقعة والفعلية.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: خطوات تكرار المشكلة
      placeholder: "1. افتح...\n2. اضغط...\n3. تظهر..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: نسخة Node وبيئة التشغيل
  - type: textarea
    id: extra
    attributes:
      label: تفاصيل أو سجل منقّح من الأسرار
