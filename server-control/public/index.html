<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Server Control</title><style>
:root{color-scheme:dark;--red:#f43f50;--muted:#a99499}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#411117 0,transparent 30%),#0b090a;color:#f8edef;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.side{border-left:1px solid #402227;background:#100b0c;padding:26px 16px}.brand{display:flex;gap:10px;align-items:center;font-weight:900;margin-bottom:32px}.mark{background:linear-gradient(135deg,#fb4053,#b01b30);display:grid;place-items:center;width:44px;height:44px;border-radius:13px;font-size:23px}.brand small{display:block;font-size:9px;letter-spacing:3px;color:#be777f}.side button{width:100%;background:transparent;border:0;color:#b69da0;text-align:right;padding:12px;border-radius:10px;margin-bottom:5px}.side button.on,.side button:hover{color:#ffb5bd;background:#3a1b20}.main{padding:28px clamp(16px,4vw,54px);max-width:1500px;width:100%}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #332023;padding-bottom:18px;margin-bottom:25px}.bar strong{letter-spacing:2px;font-size:11px;color:#ff6575}.badge{color:#ff9aa4;border:1px solid #6b3039;background:#35151a;border-radius:50px;padding:7px 11px;font-size:11px}.card{background:#181112;border:1px solid #3b2529;border-radius:16px;padding:20px;margin-bottom:14px}.card h2{margin:0 0 8px}.note{color:var(--muted);font-size:12px;line-height:1.8}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #593237;background:#28191b;color:#f5dfe1;border-radius:9px;padding:10px 15px}.btn.primary{background:#ef4758;border-color:#ef4758;color:white;font-weight:800}.terminal{background:#050505;color:#e1e4e5;border:1px solid #362123;border-radius:12px;height:400px;overflow:auto;padding:16px;direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,monospace}.input{width:100%;background:#0e090a;border:1px solid #4a2b30;color:#fff;border-radius:10px;padding:12px;direction:ltr;text-align:left}.banner{background:#3a1d16;color:#f8c5a2;padding:12px 16px;border:1px solid #694237;border-radius:10px;font-size:12px;line-height:1.7}.title{font-size:27px;margin:0 0 6px}.mini{color:#a99499;font-size:12px}.shell-row{display:flex;gap:10px;margin-top:10px}.shell-row .input{flex:1}.server-status{font-size:11px;color:#e99eaa}.hide{display:none!important}@media(max-width:720px){.layout{display:block}.side{padding:14px}.brand{margin-bottom:12px}.nav{display:flex;overflow:auto}.side button{width:auto;white-space:nowrap}.main{padding:18px}.bar{margin-bottom:15px}.shell-row{flex-wrap:wrap}.terminal{height:320px}}

.console-card{background:linear-gradient(145deg,#211315,#130e0f);box-shadow:0 20px 55px #0004}.console-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.eyebrow{font-size:10px;letter-spacing:2px;color:#fd7580;font-weight:800;margin-bottom:8px}.live-pill{white-space:nowrap;border:1px solid #74343b;color:#ff9ba5;border-radius:99px;padding:7px 12px;font-size:10px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 10px}.tools .btn{font-size:12px;padding:8px 11px}.tools .compact{width:230px;padding:8px 11px}.btn.danger{color:#ffabb1;border-color:#7a3a40}.terminal{box-shadow:inset 0 0 30px #000;height:430px}.shell-terminal{margin-bottom:9px}.hint{margin-top:10px}.server-status{margin:9px 0}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><div class="mark">⌘</div><div>مركز السيرفر<small>SERVER CONTROL</small></div></div><nav class="nav"><button class="on" data-page="files">▤ مدير الملفات</button><button data-page="log">◉ لوق البوت المباشر</button><button data-page="shell">▣ الشِل المباشر</button><button data-page="session">⚙ الجلسة والأمان</button></nav></aside><main class="main"><div class="bar"><div><strong>SERVER CONTROL / PRIVATE</strong><div class="mini">لوحة سيرفر مستقلة</div></div><div class="badge">● اتصال مشفّر · <span id="ctrl-ver">v8</span></div></div><div id="view"></div></main></div><script defer src="/server-explorer.js"></script><script defer src="/app.js"></script></body></html>
